name: Collecte Wikidata
on:
  push:
    paths: ["queries/**", "scripts/fetch.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wikidata
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          set +e
          mkdir -p data/raw
          python3 -u scripts/fetch.py 2>&1 | tee data/raw/fetch.log
          code=${PIPESTATUS[0]}
          git add data/raw/fetch.log && git commit -qm "Log de collecte" && git pull -q --rebase origin main && git push -q origin HEAD:main
          exit $code
