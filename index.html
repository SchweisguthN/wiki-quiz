<style>
:root{
  /* bureau clair (salle d'archives) */
  --desk:#d8ddc7;
  --desk-2:#c6ccb1;
  --desk-line:#7f8a66;
  /* papiers */
  --kraft:#c9b085;        /* chemise cartonnée */
  --kraft-d:#a98f60;
  --kraft-edge:#8a7047;
  --paper:#f4ecd6;        /* feuille ivoire */
  --paper-2:#ece0c2;
  --paper-line:#d9cba4;   /* réglure */
  --paper-edge:#cbb98a;
  /* encres */
  --ink:#20180f;
  --ink-mut:#6a5c44;
  --ink-faint:#9a8a68;
  --blue:#2f4a72;         /* annotation manuscrite */
  --red:#b1362a;          /* tampon rouge */
  --red-d:#8f271d;
  /* terrain */
  --green:#1e7a49;
  --green-br:#2fae66;
  --green-d:#12522f;
  --green-deep:#0c3a22;
  --gold:#c69a3f;
  --gold-l:#e2c072;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--desk);
  background-image:
    radial-gradient(120% 90% at 50% -8%, rgba(255,252,240,.65), transparent 60%),
    radial-gradient(90% 70% at 100% 0%, rgba(47,140,90,.10), transparent 55%),
    linear-gradient(180deg,#e0e5d2,#c6ccb1 82%);
  color:var(--ink);
  font-family:'Oswald',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5;
  font-variant-numeric:tabular-nums;min-height:100vh;position:relative;
}
/* dossiers disséminés sur le bureau, discrets */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27340%27%20height%3D%27340%27%20viewBox%3D%270%200%20340%20340%27%20fill%3D%27none%27%20stroke%3D%27%2373805c%27%20stroke-opacity%3D%270.55%27%20stroke-width%3D%272%27%3E%3Cg%20transform%3D%27translate%2824%2034%29%20rotate%28-9%29%27%3E%3Cpath%20d%3D%27M2%2010%20h15%20l4%20-4%20h13%20a2%202%200%200%201%202%202%20v24%20a2%202%200%200%201%20-2%202%20h-32%20a2%202%200%200%201%20-2%20-2%20v-20%20a2%202%200%200%201%202%20-2%20z%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%28196%2058%29%20rotate%2811%29%20scale%281.15%29%27%3E%3Cpath%20d%3D%27M2%2010%20h15%20l4%20-4%20h13%20a2%202%200%200%201%202%202%20v24%20a2%202%200%200%201%20-2%202%20h-32%20a2%202%200%200%201%20-2%20-2%20v-20%20a2%202%200%200%201%202%20-2%20z%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2896%20176%29%20rotate%285%29%27%3E%3Cpath%20d%3D%27M2%2010%20h15%20l4%20-4%20h13%20a2%202%200%200%201%202%202%20v24%20a2%202%200%200%201%20-2%202%20h-32%20a2%202%200%200%201%20-2%20-2%20v-20%20a2%202%200%200%201%202%20-2%20z%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%28250%20210%29%20rotate%28-13%29%20scale%28.92%29%27%3E%3Cpath%20d%3D%27M2%2010%20h15%20l4%20-4%20h13%20a2%202%200%200%201%202%202%20v24%20a2%202%200%200%201%20-2%202%20h-32%20a2%202%200%200%201%20-2%20-2%20v-20%20a2%202%200%200%201%202%20-2%20z%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2830%20250%29%20rotate%287%29%20scale%28.85%29%27%3E%3Cpath%20d%3D%27M2%2010%20h15%20l4%20-4%20h13%20a2%202%200%200%201%202%202%20v24%20a2%202%200%200%201%20-2%202%20h-32%20a2%202%200%200%201%20-2%20-2%20v-20%20a2%202%200%200%201%202%20-2%20z%27%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%27168%27%20cy%3D%27130%27%20r%3D%278%27%2F%3E%3Ccircle%20cx%3D%27300%27%20cy%3D%27120%27%20r%3D%276%27%2F%3E%3Ccircle%20cx%3D%27150%27%20cy%3D%27300%27%20r%3D%277%27%2F%3E%3C%2Fsvg%3E");
  background-repeat:repeat;background-size:340px 340px;
}
button{font:inherit;cursor:pointer;color:inherit}
::selection{background:var(--green);color:#eafff2}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--desk-2)}
::-webkit-scrollbar-thumb{background:#26382c;border-radius:6px;border:2px solid var(--desk-2)}
.wrap{max-width:1000px;margin:0 auto;padding:6px 20px 90px;position:relative;z-index:1}
:focus-visible{outline:2.5px solid var(--green-br);outline-offset:2px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ Bandeau logo ============ */
.brandbar{max-width:1000px;margin:0 auto;padding:20px 20px 0;display:flex;align-items:center;position:relative;z-index:1}
.brand{display:inline-flex;align-items:center;gap:13px;background:none;border:none;padding:4px;transition:transform .16s var(--ease)}
.brand:hover{transform:translateY(-1px)}
.brand .crest{width:40px;height:50px;flex:none;filter:drop-shadow(0 3px 7px rgba(0,0,0,.5))}
.brand .wordmark{text-align:left;line-height:.9}
.brand .wordmark .t1{display:block;font-family:'Oswald',sans-serif;font-weight:700;font-size:25px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.brand .wordmark .t2{display:block;font-family:'Courier Prime',monospace;font-weight:400;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--green-d);margin-top:5px}

/* ============ Tampons ============ */
.stamp{font-family:'Saira Stencil One',Oswald,sans-serif;text-transform:uppercase;letter-spacing:.06em;
  border:2.5px solid currentColor;border-radius:5px;padding:5px 11px;display:inline-flex;align-items:center;gap:7px;
  color:var(--red);opacity:.9;line-height:1;font-size:13px;
  box-shadow:inset 0 0 0 1.5px currentColor;background:rgba(255,255,255,.02)}
.stamp.tilt{transform:rotate(-7deg)}
.stamp.green{color:var(--green)}
.stamp.blue{color:var(--blue)}
.stamp.gold{color:var(--gold)}

/* ============ Accueil (Compo B — bento) ============ */

@media(max-width:960px){.decor-fan,.decor-fiches{display:none}}
.homeB .bento{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 0}
.homeB .card{background:linear-gradient(180deg,var(--paper),var(--paper-2));border:1px solid var(--paper-edge);border-radius:16px;padding:18px 20px;box-shadow:0 12px 28px -18px rgba(0,0,0,.45)}
.homeB .card.hero{grid-column:1/-1;display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:center}
.homeB .card.champ{grid-column:1/-1}
.homeB .card.cta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media(max-width:720px){.homeB .bento{grid-template-columns:1fr}.homeB .card.hero{grid-template-columns:1fr}.homeB .card.periode,.homeB .card.diff{grid-column:1/-1}.homeB .scene{display:none}}
.kline{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-mut);display:inline-flex;align-items:center;gap:10px}
.kline::before{content:"";width:26px;height:2px;background:var(--gold)}
h1.big{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(28px,4.4vw,46px);line-height:1;letter-spacing:.01em;margin:12px 0 0;color:var(--ink);text-wrap:balance}
h1.big em{font-style:normal;color:var(--green);background:linear-gradient(transparent 62%,rgba(30,122,73,.2) 0);padding:0 .06em}
.lead{margin:14px 0 0;color:var(--ink-mut);font-family:'Courier Prime',monospace;font-size:13px;max-width:44ch;line-height:1.6}
.scene{position:relative;height:210px}
.scene .o{position:absolute;border-radius:7px;box-shadow:0 16px 34px -16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.scene .folder{width:180px;height:144px;background:linear-gradient(160deg,var(--kraft),var(--kraft-d));border:1px solid var(--kraft-edge)}
.scene .folder::before{content:"";position:absolute;top:-11px;left:20px;width:74px;height:14px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--green),var(--green-d))}
.scene .f1{left:2%;top:56px;transform:rotate(-7deg)}
.scene .f2{right:4%;top:70px;transform:rotate(9deg)}
.scene .fiche{width:164px;height:190px;left:33%;top:4px;transform:rotate(2.5deg);background:var(--paper);border:1px solid var(--paper-edge);padding:13px 12px;z-index:3}
.scene .fiche .fh{font-family:'Oswald',sans-serif;font-weight:700;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--green-deep);border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.scene .fiche .rb{height:12px;background:#1b160d;border-radius:2px;margin:11px 0 4px}
.scene .fiche .rb.s{width:60%}
.scene .fiche .ln{height:1px;background:var(--paper-line);margin:13px 0}
.scene .fiche .st{position:absolute;right:-8px;top:48px;font-family:'Saira Stencil One',sans-serif;font-size:8.5px;letter-spacing:.06em;color:var(--red);border:2px solid var(--red);border-radius:4px;padding:3px 6px;transform:rotate(-8deg);background:var(--paper)}
.scene .clip{position:absolute;left:30%;top:-2px;width:13px;height:38px;border:3px solid #9aa3ad;border-radius:8px;z-index:4;transform:rotate(6deg)}
.grouphead{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
.grouphead .n{font-family:'Courier Prime',monospace;font-weight:700;font-size:12px;color:var(--green-deep);border:1.5px solid var(--green-d);border-radius:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none}
.grouphead h3{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:14.5px;margin:0;color:var(--ink)}
.grouphead .hint{margin:0 0 0 auto;font-family:'Courier Prime',monospace;font-size:11px;color:var(--ink-mut);text-align:right;max-width:40ch;line-height:1.4}
.leagues{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.lg{display:flex;align-items:center;gap:10px;border:1px solid var(--paper-edge);border-radius:9px;padding:10px 12px;background:#fffdf6;color:var(--ink);user-select:none;position:relative;transition:all .14s var(--ease);box-shadow:0 1px 0 rgba(0,0,0,.04)}
.lg:hover{border-color:var(--kraft-edge);transform:translateY(-1px)}
.lg.on{border-color:var(--green);box-shadow:0 0 0 1.5px var(--green) inset;background:#f3f6ec}
.lg input{position:absolute;opacity:0;pointer-events:none}
.lg .flag{width:26px;height:18px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}
.lg .nm{font-family:'Oswald',sans-serif;font-weight:500;font-size:14px}
.lg .box{margin-left:auto;width:19px;height:19px;border-radius:4px;border:2px solid var(--paper-edge);background:#fff;flex:none;display:flex;align-items:center;justify-content:center;transition:all .14s var(--ease)}
.lg.on .box{background:var(--green);border-color:var(--green)}
.lg .box svg{width:11px;height:11px;opacity:0}
.lg.on .box svg{opacity:1}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.choice{border:1px solid var(--paper-edge);border-radius:9px;padding:11px 13px;background:#fffdf6;color:var(--ink);text-align:left;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:14px;transition:all .14s var(--ease)}
.choice:hover{border-color:var(--kraft-edge);transform:translateY(-1px)}
.choice.on{border-color:var(--green);box-shadow:0 0 0 1.5px var(--green) inset;color:var(--green-deep);background:#f3f6ec}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.tier{border:1px solid var(--paper-edge);border-radius:10px;padding:12px 13px;background:#fffdf6;color:var(--ink);text-align:left;position:relative;overflow:hidden;transition:all .16s var(--ease)}
.tier::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc)}
.tier:hover{transform:translateY(-2px)}
.tier.on{border-color:var(--acc);box-shadow:0 0 0 1.5px var(--acc) inset}
.tier .tt{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tier .t{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:14.5px}
.tier .cote{display:inline-flex;gap:2px;color:var(--acc)}
.tier .cote i{width:8px;height:8px;display:inline-block;background:currentColor;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.3}
.tier .cote i.f{opacity:1}
.tier .lab{font-family:'Courier Prime',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:7px}
.tier .d{color:var(--ink-mut);font-size:11.5px;margin-top:3px;font-family:'Bitter',Georgia,serif;font-style:italic;line-height:1.35}
.tier.t-facile{--acc:var(--green)}.tier.t-moyen{--acc:var(--blue)}.tier.t-difficile{--acc:var(--gold)}.tier.t-legende{--acc:var(--red)}
.pool{color:var(--ink-mut);font-family:'Courier Prime',monospace;font-size:13px}
.pool b{color:var(--ink);font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;margin:0 2px}
.play{position:relative;background:linear-gradient(180deg,var(--green-br),var(--green));color:#eafff2;border:none;border-radius:11px;padding:15px 34px;font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em;box-shadow:0 4px 0 var(--green-d),0 14px 24px -12px rgba(30,122,73,.5);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.play:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--green-d),0 18px 30px -12px rgba(30,122,73,.6)}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}
.play:disabled{background:#3a4a40;color:#8fa093;box-shadow:none;cursor:not-allowed;transform:none}

/* ============ Jeu — topbar ============ */
.topbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 24px;gap:16px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--kraft),var(--kraft-d));border:1px solid var(--kraft-edge);border-radius:6px;padding:12px 18px;color:var(--ink);
  box-shadow:0 10px 26px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.2)}
.progress{display:flex;gap:6px;align-items:center}
.dot{width:20px;height:7px;border-radius:2px;background:rgba(32,24,15,.22);transition:all .25s var(--ease)}
.dot.done.good{background:var(--green)}
.dot.done.bad{background:var(--red)}
.dot.cur{background:var(--gold);box-shadow:0 0 0 2px rgba(198,154,63,.3)}
.qn{font-family:'Courier Prime',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mut);font-size:12.5px}
.score{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-mut)}
.score b{color:var(--green-deep);font-family:'Saira Stencil One',sans-serif;font-size:22px;margin-left:7px;vertical-align:-2px}

.stage{display:grid;grid-template-columns:1.08fr .92fr;gap:26px;align-items:start}
@media(max-width:820px){.stage{grid-template-columns:1fr;gap:20px}}

/* ============ LA FICHE (feuille dans la chemise) ============ */
.folder{position:relative;background:linear-gradient(180deg,var(--kraft),var(--kraft-d));border-radius:5px;padding:16px 14px 20px;
  border:1px solid var(--kraft-edge);
  box-shadow:0 30px 60px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.22)}
.folder::before{content:"ARCHIVES — JOUEURS";position:absolute;top:-19px;right:24px;height:21px;padding:0 16px;
  display:flex;align-items:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:10px;letter-spacing:.18em;color:#eafff2;
  background:linear-gradient(180deg,var(--green),var(--green-d));border-radius:5px 5px 0 0}
.sheet{background:linear-gradient(180deg,var(--paper),var(--paper-2));
  color:var(--ink);border-radius:3px;position:relative;transform:rotate(-.4deg);overflow:hidden;
  border:1px solid var(--paper-edge);
  box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:1.5px;background:var(--red);opacity:.35}
.sheet .sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px 44px;border-bottom:2px solid var(--ink);position:relative}
.sheet .sh-h .ttl{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:13.5px}
.sheet .sh-h .fno{font-family:'Courier Prime',monospace;font-size:11px;color:var(--ink-mut);letter-spacing:.04em}

/* bloc identité caviardé */
.ident{padding:4px 16px 6px 44px}
.ident .lines{min-width:0}
.ident .fl{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-line)}
.ident .fl:last-child{border-bottom:none}
.ident .fl .k{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut);width:96px;flex:none}
.ident .fl .v{font-family:'Courier Prime',monospace;font-weight:700;font-size:15px;color:var(--ink)}
.ident .fl .redact{height:15px;border-radius:2px;background:#1b160d;flex:1 1 auto;max-width:210px;box-shadow:0 1px 0 rgba(255,255,255,.2)}
.ident .fl .redact.short{max-width:130px}

/* le grand tampon "identité masquée" en travers */
.ident-wrap{position:relative}
.ident-wrap .cross{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-9deg);z-index:3;font-size:13px}
@media(max-width:420px){.ident-wrap .cross{display:none}}

/* révélation */
.reveal-name{font-family:'Courier Prime',monospace;font-weight:700;font-size:16px;color:var(--green-deep);
  animation:typein .4s var(--ease)}
@keyframes typein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.stamp.pop{animation:stamppop .35s var(--ease)}
@keyframes stamppop{0%{transform:rotate(-9deg) scale(1.6);opacity:0}60%{opacity:1}100%{transform:rotate(-9deg) scale(1)}}

/* enregistrement (le parcours) */
.rec{padding:6px 16px 4px 44px}
.rec-h{display:grid;grid-template-columns:1fr 88px 62px;gap:8px;padding:6px 0 7px;border-bottom:1.5px solid var(--ink);
  font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mut)}
.rec-h span:nth-child(2){text-align:center}
.rec-h span:nth-child(3){text-align:right}
.row{display:grid;grid-template-columns:1fr 88px 62px;gap:8px;align-items:baseline;padding:9px 0;position:relative;border-bottom:1px solid var(--paper-line)}
.row .club{font-family:'Courier Prime',monospace;font-weight:700;font-size:14px;color:var(--ink);line-height:1.3}
.row.big .club{color:var(--green-deep)}
.row .yr{font-family:'Courier Prime',monospace;font-size:12px;color:var(--ink-mut);text-align:center;white-space:nowrap}
.row .ap{font-family:'Courier Prime',monospace;font-size:12px;color:var(--ink-mut);text-align:right;white-space:nowrap}
.row .ap b{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:var(--ink)}
.row.big .ap b{color:var(--green-deep);font-size:18px}
.row .ap .na{color:var(--ink-faint)}
.row.nested .club{padding-left:52px;font-weight:700;font-style:italic;color:var(--ink);position:relative}
.row.nested .club::before{content:"PRÊT";position:absolute;left:0;top:1px;font-style:normal;font-family:'Oswald',sans-serif;font-weight:700;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--green-d);padding:2px 6px;border-radius:3px;line-height:1.25}
.rec .tot{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0 4px;margin-top:2px;border-top:1.5px solid var(--ink);
  font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mut)}

/* annotations (indices) collées sur la marge */
.hints{padding:12px 16px 16px 44px;display:flex;gap:10px;flex-wrap:wrap}
.hint-chip{font-size:12.5px;background:#fffcf0;border:1px solid var(--paper-edge);border-left:3px solid var(--blue);
  padding:6px 11px;font-family:'Courier Prime',monospace;box-shadow:1px 1px 0 rgba(0,0,0,.08);transform:rotate(-.6deg)}
.hint-chip:nth-child(2){transform:rotate(.7deg)}
.hint-chip .k{color:var(--ink-mut);text-transform:uppercase;font-size:9px;letter-spacing:.1em;display:block;margin-bottom:1px}
.hint-chip .v{font-weight:700;color:var(--blue)}

/* footer fiche : cote de difficulté tamponnée */
.sh-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 14px 44px;border-top:2px solid var(--ink)}
.sh-f .meta{font-family:'Courier Prime',monospace;font-size:10.5px;color:var(--ink-mut);letter-spacing:.04em}

/* ============ Panneau identification (guess) ============ */
.guess{background:linear-gradient(180deg,var(--kraft),var(--kraft-d));border:1px solid var(--kraft-edge);border-radius:6px;overflow:hidden;color:var(--ink);
  box-shadow:0 24px 46px -26px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.2);position:sticky;top:14px}
.guess-h{padding:14px 18px;display:flex;align-items:center;gap:11px;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink);
  border-bottom:2px dashed var(--kraft-edge)}
.guess-h .qm{width:26px;height:26px;border-radius:5px;background:var(--green);color:#eafff2;
  display:flex;align-items:center;justify-content:center;font-family:'Saira Stencil One',sans-serif;font-size:14px;flex:none}
.guess-body{padding:20px;background:var(--paper);margin:0}
.formlab{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mut);margin:0 0 7px}
.searchbox{position:relative}
.searchbox input{width:100%;padding:13px 14px;border:1.5px solid var(--paper-edge);border-radius:5px;font-size:15px;
  background:#fffdf6;color:var(--ink);outline:none;transition:border-color .14s,box-shadow .14s;font-family:'Courier Prime',monospace}
.searchbox input::placeholder{color:#a99e83}
.searchbox input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(30,122,73,.14)}
.searchbox input:disabled{background:#efe9d8}
.ac{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 5px);background:#fffdf6;border:1.5px solid var(--paper-edge);
  border-radius:5px;box-shadow:0 16px 34px -14px rgba(0,0,0,.5);max-height:244px;overflow:auto}
.ac div{padding:11px 14px;font-size:14px;border-top:1px solid #eadfc4;font-family:'Courier Prime',monospace;color:var(--ink);transition:background .1s}
.ac div:first-child{border-top:none}
.ac div.sel{background:#eef3e4;color:var(--green-deep)}
.tries{display:flex;gap:8px;margin-top:16px;align-items:center}
.pip{width:15px;height:15px;border-radius:50%;border:2px solid var(--red);transition:all .25s var(--ease)}
.pip.full{background:var(--red)}
.pip.spent{border-color:var(--paper-edge);background:transparent}
.tries .lbl{color:var(--ink-mut);font-size:12px;margin-left:6px;font-family:'Courier Prime',monospace;text-transform:uppercase;letter-spacing:.04em}
.feedback{margin-top:16px;padding:13px 15px;border-radius:5px;font-size:13.5px;font-weight:600;border:1.5px solid transparent;font-family:'Oswald',sans-serif}
.feedback.err{background:#f6e2dd;color:var(--red-d);border-color:#e0b4ab}
.feedback.good{background:#e3f0e2;color:var(--green-deep);border-color:#b4d3b4}
.feedback.reveal{background:#f3ead0;color:var(--ink);border-color:var(--paper-edge)}
.feedback .sub{margin-top:4px;font-family:'Saira Stencil One',sans-serif;font-size:19px;font-weight:400;text-transform:uppercase;letter-spacing:.01em}
.feedback.err .sub{font-family:'Bitter',serif;font-style:italic;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-mut)}
.hintrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.link{background:#fffdf6;border:1.5px solid var(--paper-edge);border-left:3px solid var(--blue);color:var(--blue);font-weight:600;padding:8px 12px;
  font-size:12px;border-radius:4px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;transition:all .14s var(--ease)}
.link:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.skip{margin-top:18px;background:none;border:1.5px solid var(--paper-edge);color:var(--ink-mut);border-radius:5px;
  padding:12px 16px;font-weight:600;font-size:12px;width:100%;transition:all .14s var(--ease);font-family:'Oswald',sans-serif;
  text-transform:uppercase;letter-spacing:.05em}
.skip:hover{border-color:var(--red);color:var(--red-d);background:#f7eae7}

/* ============ Récap : dossier clos ============ */
.recap-head{position:relative;overflow:hidden;border-radius:6px;padding:0;margin:16px 0 24px;
  background:linear-gradient(180deg,var(--kraft),var(--kraft-d));border:1px solid var(--kraft-edge);color:var(--ink);
  box-shadow:0 26px 60px -28px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.2)}
.recap-head .rh-in{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:26px 30px}
.grade{width:130px;height:130px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;
  background:var(--paper);border:2px solid var(--ink);position:relative;transform:rotate(-2deg);
  box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.grade .gs{font-family:'Saira Stencil One',sans-serif;font-size:52px;line-height:.8;color:var(--green-deep)}
.grade .gs span{font-size:.42em;color:var(--ink-mut)}
.grade .gl{font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-mut);margin-top:8px}
.rmsg .rt{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,32px);line-height:1;color:var(--ink);text-transform:uppercase}
.rmsg p{font-family:'Bitter',Georgia,serif;font-style:italic;color:var(--ink-mut);font-size:15px;margin:10px 0 0}
@media(max-width:640px){.recap-head .rh-in{grid-template-columns:1fr;justify-items:center;text-align:center}}

.rlist{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:640px){.rlist{grid-template-columns:1fr}}
.ritem{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:5px;
  padding:12px 14px;color:var(--ink);position:relative;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.ritem .mk{width:26px;height:26px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.ritem.good .mk{background:var(--green);color:#eafff2}
.ritem.bad .mk{background:var(--red);color:#fff}
.ritem .nm{font-family:'Courier Prime',monospace;font-weight:700;font-size:14px}
.ritem .meta{color:var(--ink-mut);font-size:11px;margin-left:auto;text-align:right;font-family:'Courier Prime',monospace;text-transform:uppercase;letter-spacing:.02em}
.again{margin-top:26px;background:linear-gradient(180deg,var(--green-br),var(--green));color:#eafff2;border:none;border-radius:7px;padding:15px 34px;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em;
  box-shadow:0 4px 0 var(--green-d),0 14px 26px -12px rgba(30,122,73,.6);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.again:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--green-d),0 18px 30px -12px rgba(30,122,73,.7)}
.again:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-d)}

/* ============ Modale ============ */
.overlay{position:fixed;inset:0;background:rgba(4,10,6,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fade .16s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--paper);border:1px solid var(--paper-edge);border-radius:6px;max-width:420px;width:100%;padding:26px;color:var(--ink);
  box-shadow:0 30px 70px -20px rgba(0,0,0,.85)}
.dialog h3{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0 0 10px;font-size:22px;color:var(--ink)}
.dialog p{margin:0 0 22px;color:var(--ink-mut);font-size:14px;font-family:'Courier Prime',monospace}
.dialog .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.dialog button{border-radius:5px;padding:11px 17px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;
  text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--paper-edge);background:#fffdf6;color:var(--ink);transition:all .12s var(--ease)}
.dialog button:hover{background:#f1ebd9}
.dialog button.danger{background:var(--red);border-color:var(--red-d);color:#fff}
.dialog button.danger:hover{background:var(--red-d)}
</style>
</head>

function norm(s){
  const map={'ı':'i','ø':'o','ł':'l','ß':'ss','ð':'d','đ':'d','æ':'ae','œ':'oe'};
  s=s.toLowerCase();
  s=[...s].map(c=>map[c]||c).join('');
  s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  s=s.replace(/['’\-.]/g,'');
  s=s.replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  return s;
}
const ALLKEYS=DATA.names.map(x=>({n:x.n,k:x.k}));
const RES_B=/\bB\b|\bII\b| B$|réserve|reserve|amateurs?$|U-?\d+/i;
function markNested(career){
  const y=s=>/^\d+$/.test(s)?parseInt(s):null;
  const sp=career.map(c=>({s:y(c.start),e:y(c.end),club:c.club}));
  return sp.map((a,i)=>{
    if(a.s===null||a.e===null) return null;
    for(let j=0;j<sp.length;j++){
      const b=sp[j];
      if(i===j||b.s===null||b.e===null||a.club===b.club) continue;
      if(a.s>b.s && a.e<b.e){
        const base=a.club.replace(RES_B,'').trim();
        if(RES_B.test(a.club) && base && b.club.includes(base)) continue;
        return b.club;
      }
    }
    return null;
  });
}
function pickPool(leagues,yr,diff){
  return DATA.players.filter(p=>{
    if(diff && p.diff!==diff) return false;
    if(leagues.length && !p.leagues.some(l=>leagues.includes(l))) return false;
    const first=p.first??YMIN, last=p.last??YMAX;
    if(last<yr[0]||first>yr[1]) return false;
    return true;
  });
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function Game({series,onEnd}){
  const [i,setI]=useState(0);
  const [results,setResults]=useState([]);
  const p=series[i];
  function resolve(good){
    const res=[...results,{p,good}];
    setResults(res);
    if(i+1>=series.length){ setTimeout(()=>onEnd(res),0); }
    else setI(i+1);
  }
  const score=results.filter(r=>r.good).length;
  return (
   <div className="wrap">
     <div className="topbar">
       <div className="progress">
         {series.map((_,k)=>{
           const r=results[k];
           let cls="dot"; if(k<results.length){cls+=" done "+(r.good?"good":"bad");} else if(k===i){cls+=" cur";}
           return <span key={k} className={cls}></span>;
         })}
       </div>
       <div className="qn">Fiche {i+1} / {series.length}</div>
       <div className="score">Score<b>{score}</b></div>
     </div>
     <div className="stage">
       <GuessHost key={p.id} p={p} onResolve={resolve}/>
     </div>
   </div>
  );
}
function GuessHost({p,onResolve}){
  const [shown,setShown]=useState({nat:false,pos:false,ini:false});
  const [q,setQ]=useState('');const [tries,setTries]=useState(0);
  const [fb,setFb]=useState(null);const [locked,setLocked]=useState(false);const [sel,setSel]=useState(0);
  const [outcome,setOutcome]=useState(null);
  const inputRef=useRef();
  useEffect(()=>{setShown({nat:false,pos:false,ini:false});setQ('');setTries(0);setFb(null);setLocked(false);setSel(0);setOutcome(null);
    setTimeout(()=>inputRef.current&&inputRef.current.focus(),50);},[p.id]);
  const nq=norm(q);
  const matches=useMemo(()=>nq.length<2?[]:ALLKEYS.filter(x=>x.k.includes(nq)).slice(0,8),[nq]);
  function resolve(good){setLocked(true);setOutcome(good?'good':'bad');
    setFb(good?{type:'good',msg:'Identité confirmée.',sub:p.name}:{type:'reveal',msg:'Dossier déclassé. C’était :',sub:p.name});
    setTimeout(()=>onResolve(good),2300);}
  function submitName(name){if(locked)return;const t=tries+1;setTries(t);
    if(norm(name)===p.key){resolve(true);return;}
    if(t>=3)resolve(false);
    else{setFb({type:'err',msg:'Nom non concordant.',sub:(3-t)+' essai'+(3-t>1?'s':'')+' restant'+(3-t>1?'s':'')});setQ('');setSel(0);setTimeout(()=>inputRef.current&&inputRef.current.focus(),30);}}
  function onKey(e){if(locked)return;
    if(e.key==='ArrowDown'){e.preventDefault();setSel(s=>Math.min(s+1,matches.length-1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setSel(s=>Math.max(s-1,0));}
    else if(e.key==='Enter'){e.preventDefault();
      if(matches.length)submitName(matches[sel].n);
      else{const ex=ALLKEYS.find(x=>x.k===nq);if(ex)submitName(ex.n);}}}
  const hint=k=>setShown(s=>({...s,[k]:true}));
  return (
   <React.Fragment>
     <Career p={p} shown={shown} revealed={locked} outcome={outcome}/>
     <div className="guess">
       <div className="guess-h"><span className="qm">?</span>Identification</div>
       <div className="guess-body">
       <p className="formlab">Nom du joueur</p>
       <div className="searchbox">
         <input ref={inputRef} value={q} disabled={locked} placeholder="Saisir un nom…"
           onChange={e=>{setQ(e.target.value);setSel(0);}} onKeyDown={onKey} autoComplete="off"/>
         {!locked && matches.length>0 &&
           <div className="ac">{matches.map((m,idx)=>(
             <div key={m.k+idx} className={idx===sel?'sel':''} onMouseEnter={()=>setSel(idx)}
               onMouseDown={e=>{e.preventDefault();submitName(m.n);}}>{m.n}</div>))}</div>}
       </div>
       <div className="tries">
         {[0,1,2].map(idx=><span key={idx} className={"pip"+(idx<3-tries?" full":" spent")}></span>)}
         <span className="lbl">{3-tries} essai{3-tries>1?'s':''} restant{3-tries>1?'s':''}</span>
       </div>
       {fb && <div className={"feedback "+fb.type}>{fb.msg}{fb.sub&&<div className="sub">{fb.sub}</div>}</div>}
       {!locked &&
         <div className="hintrow">
           {!shown.nat && <button className="link" onClick={()=>hint('nat')}>+ Nationalité</button>}
           {!shown.pos && <button className="link" onClick={()=>hint('pos')}>+ Poste</button>}
           {!shown.ini && <button className="link" onClick={()=>hint('ini')}>+ Initiales</button>}
         </div>}
       {!locked &&
         <button className="skip" onClick={()=>resolve(false)}>Abandonner et déclasser</button>}
       </div>
     </div>
   </React.Fragment>
  );
}

function Recap({results,onAgain}){
  const score=results.filter(r=>r.good).length;
  const total=results.length;
  const pct=total?score/total:0;
  const rank=pct>=.9?'Recruteur en chef':pct>=.7?'Titulaire':pct>=.4?'Recrue':pct>=.2?'Stagiaire':'Tribune';
  const msg=score>=8?'Chapeau, tu connais ton football.':score>=5?'Joli, mais quelques trous.':score>=2?'La mémoire flanche un peu.':'Rude série. On y retourne ?';
  return (
   <div className="wrap recap">
     <div className="recap-head">
       <div className="rh-in">
         <div className="grade"><div className="gs">{score}<span>/{total}</span></div><div className="gl">{rank}</div></div>
         <div className="rmsg"><div className="rt">Dossier clos</div><p>{msg}</p></div>
         <span className="stamp tilt green" style={{alignSelf:'flex-start'}}>Traité</span>
       </div>
     </div>
     <div className="rlist">
       {results.map((r,i)=>(
         <div className={"ritem "+(r.good?"good":"bad")} key={i}>
           <span className="mk">{r.good?'✓':'✗'}</span>
           <span className="nm">{r.p.name}</span>
           <span className="meta">{r.p.nat} · {r.p.pos}</span>
         </div>
       ))}
     </div>
     <button className="again" onClick={onAgain}>Nouveau dossier</button>
   </div>
  );
}

function App(){
  const [screen,setScreen]=useState('setup');
  const [series,setSeries]=useState([]);
  const [results,setResults]=useState([]);
  const [confirm,setConfirm]=useState(false);
  function goHome(){ setScreen('setup'); setSeries([]); setResults([]); setConfirm(false); }
  function onBrand(){ if(screen==='game') setConfirm(true); else goHome(); }
  return (
   <React.Fragment>
     <Brand onHome={onBrand}/>
     {screen==='setup' && <Setup onStart={s=>{setSeries(s);setScreen('game');}}/>}
     {screen==='game' && <Game series={series} onEnd={r=>{setResults(r);setScreen('recap');}}/>}
     {screen==='recap' && <Recap results={results} onAgain={goHome}/>}
     {confirm &&
       <div className="overlay" onClick={()=>setConfirm(false)}>
         <div className="dialog" role="dialog" aria-modal="true" onClick={e=>e.stopPropagation()}>
           <h3>Quitter le dossier ?</h3>
           <p>La série en cours sera abandonnée et le score perdu.</p>
           <div className="acts">
             <button onClick={()=>setConfirm(false)}>Continuer</button>
             <button className="danger" onClick={goHome}>Quitter</button>
           </div>
         </div>
       </div>}
   </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
